<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STATIC BALANCE — Truss Bridge Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<header id="top">
 <button class="ic only-m" id="tgL" data-ic="menu" title="Tools"></button>
 <div class="logo"><span class="mark"></span><b>STATIC BALANCE</b></div>
 <button id="lvBtn" class="lvl" title="Choose challenge"><small>Challenge</small><span id="lvName"></span></button>
 <button id="tutBtn" class="lvl" title="Guided tutorials"><small>Learn</small><span>Tutorial</span></button>
 <div id="status" class="pill idle">Ready to build</div>
 <div class="sp"></div>
 <button id="reset" class="btn ghost" data-ic="reset">Reset</button>
 <button id="run" class="btn run" data-ic="play">Run simulation</button>
 <button id="settings" class="ic" data-ic="gear" title="Settings"></button>
 <button class="ic only-m" id="tgR" data-ic="panel" title="Engineering panel"></button>
</header>
<main>
 <aside id="left">
  <h3>Build tools</h3>
  <button class="tool" data-tool="select" data-ic="select">Select <kbd>V</kbd></button>
  <button class="tool" data-tool="node" data-ic="node">Node <kbd>N</kbd></button>
  <button class="tool" data-tool="beam" data-ic="beam">Beam <kbd>B</kbd></button>
  <div class="row2"><button class="tool" data-btype="straight" data-ic="straight">Straight</button><button class="tool" data-btype="curve" data-ic="curve">Curve</button></div>
  <button class="tool" data-tool="support" data-ic="support">Support <kbd>S</kbd></button>
  <button class="tool" data-tool="load" data-ic="load">Load <kbd>L</kbd></button>
  <button class="tool" data-tool="delete" data-ic="delete">Delete <kbd>X</kbd></button>
  <div class="row2"><button class="tool" id="undo" data-ic="undo">Undo</button><button class="tool" id="redo" data-ic="redo">Redo</button></div>
  <div class="row2"><button class="tool" data-act="saveSlot" data-ic="save">Save</button><button class="tool" data-act="loadSlot" data-ic="folder">Load</button></div>
  <div id="obj" class="obj"></div>
  <div class="sig">LINO MADE THIS</div>
 </aside>
 <section id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
   <div class="seg"><button data-view="util" class="on">Utilisation</button><button data-view="force">Tension / compression</button></div>
   <div class="seg"><button data-act="zout">−</button><button data-act="fit">Fit</button><button data-act="zin">+</button><button data-act="lab">Labels</button></div>
  </div>
  <div id="legend"></div>
  <div id="chk"></div>
  <div id="coach" hidden></div>
  <div id="dim"><b id="dFrom"></b><label>Length <input id="dL" type="number" step="0.1" min="0.4" placeholder="m"> m</label><label>Angle <input id="dA" type="number" step="1" placeholder="deg"> °</label><button id="dGo">Add beam</button><small>0° = right, 90° = up · Enter to add</small></div>
  <div id="hint"></div>
 </section>
 <aside id="right"><div id="panel"></div></aside>
</main>
<footer id="bar">
 <div>Cost <b id="bCost"></b></div><div>Nodes <b id="bN"></b></div><div>Beams <b id="bB"></b></div><div>Applied load <b id="bL"></b></div><div>Stability <b id="bS"></b></div>
</footer>
<div id="modal" hidden></div><div id="toasts"></div>
<script src="physics.js"></script><script src="levels.js"></script><script src="script.js"></script>
</body></html>
